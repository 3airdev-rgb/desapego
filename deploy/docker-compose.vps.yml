# Desapego na VPS, como novo serviço Docker atrás do Caddy existente (ArremataFlow).
# NÃO publica as portas 80/443 nem nenhuma porta no host: o Caddy acessa o app pela rede
# Docker "arremataflow_default", em http://desapego:3111.
#
# Iniciar / atualizar (na pasta do projeto, na VPS):
#   docker compose -f deploy/docker-compose.vps.yml up -d --build
# Reiniciar:  docker compose -f deploy/docker-compose.vps.yml restart desapego
# Logs:       docker compose -f deploy/docker-compose.vps.yml logs -f desapego
# Parar só o Desapego:  docker compose -f deploy/docker-compose.vps.yml down   (não afeta o ArremataFlow)

name: desapego

services:
  desapego:
    build:
      context: ..
    image: desapego-arrivoinitalia:vps
    container_name: desapego
    env_file:
      - ../.env.vps
    environment:
      PORT: "3111"
      HOST: 0.0.0.0
      DATA_DIR: /app/data
    volumes:
      # Banco SQLite e fotos (data/uploads) ficam no disco da VPS, fora do contêiner.
      - ../data:/app/data
    networks:
      - arremataflow_default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3111/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  arremataflow_default:
    external: true
