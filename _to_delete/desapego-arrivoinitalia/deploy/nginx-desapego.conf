# Nginx: publica o Desapego em desapego.arrivoinitalia.com
# Instalado em /etc/nginx/sites-available/desapego.arrivoinitalia.com pelo setup-vps.sh.
# O Certbot acrescenta o bloco HTTPS (443) automaticamente.

server {
    listen 80;
    listen [::]:80;
    server_name desapego.arrivoinitalia.com;

    # Fotos de até 8 MB, até 12 por envio.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
